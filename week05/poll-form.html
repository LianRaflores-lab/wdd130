<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lianzel Raflores | WDD 130</title>
    <meta name="description" content="form practice">
    <meta name="author" content="Lianzel Raflores">
    <link rel="stylesheet" href="styles/poll-form.css">

</html>

<main>
    <form>
        <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="form-item column2">
            <label for="usermail">Email:</label>
            <input type="email" id="usermail" name="usermail" required>
        </div>

        <button type="submit">Submit Poll</button>

        <label for="quantity">Select Quantity</label>
        <select name="quantity" id="quantity">
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
        </select>

        <div class="form-item column1">
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="Brave"></option>
                <option value="Other"></option>
            </select>
        </div>


        <div class="form-item column1">
            <label for="pet">Do you have a favorite pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>

        <div class="form-item column1">
            <label for="feedback">List the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            <button type="submit">Submit Poll</button>
        </div>
    </form>
</main>
