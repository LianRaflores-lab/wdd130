<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids Adventure Rafting</title>
    <meta name="description" content="Rapid's Adventures Contact Us page">
    <meta name="author" content="Lianzel Raflores">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rapids_logo.jpg" alt="Rafting Company Logo" class="logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Rapids Adventure Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-layout">

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=" loading="lazy">
                </iframe>
            </div>

            <section class="contact-form">
                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" rows="6" placeholder="Type here"></textarea>

                    <label class="checkbox">
                        <input type="checkbox">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>
            </section>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee.jpg" alt="Employee">
                <figcaption>Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee">
                <figcaption>Tour Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee">
                <figcaption>Life Guard</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Lianzel Raflores</p>

        <nav>
            <div class="sociallinks">
                <a href="#">
                    <img src="images/facebook.png" alt="Facebook">
                </a>

                <a href="#">
                    <img src="images/instagram.png" alt="Instagram">
                </a>

                <a href="#">
                    <img src="images/linkedin.png" alt="linkedin">
                </a>
            </div>
        </nav>
    </footer>

</body>

</html>
